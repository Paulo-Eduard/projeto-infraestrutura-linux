[global]
   workgroup = WORKGROUP
   server string = Servidor de Arquivos
   server role = standalone server
   security = user
   map to guest = never
   server min protocol = SMB2
   log file = /var/log/samba/log.%m
   max log size = 1000

[web]
   comment = HTML e imagens do servidor web
   path = /srv/samba/web
   read only = no
   valid users = @gpr_web @gpr_admin
   create mask = 0660
   directory mask = 2770

[dados]
   comment = Arquivos do banco de dados e aplicacoes
   path = /srv/samba/dados
   read only = no
   valid users = @gpr_dados @gpr_admin
   create mask = 0660
   directory mask = 2770

[publica]
   comment = Troca geral de arquivos
   path = /srv/samba/publica
   read only = no
   valid users = @gpr_todos
   create mask = 0660
   directory mask = 2770

[backups]
   comment = Armazenamento dos backups
   path = /srv/backups
   read only = no
   valid users = @gpr_admin
   create mask = 0660
   directory mask = 2770
