# REFERÊNCIA de parâmetros para o postgresql.conf do cluster.
# Não substitua o arquivo completo do PostgreSQL por este fragmento.
# Essa configuração é para a arquitetura com servidores separados.
listen_addresses = 'localhost,192.168.30.10'
port = 5432
password_encryption = 'scram-sha-256'

# Logs básicos para diagnóstico.
logging_collector = on
log_line_prefix = '%m [%p] %u@%d '
log_min_duration_statement = 1000
