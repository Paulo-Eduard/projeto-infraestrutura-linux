# InfraLab - Configuração Nginx para Servidor Web e Proxy Reverso
server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/infralab_access.log;
    error_log /var/log/nginx/infralab_error.log warn;
    client_max_body_size 10M;

    # Frontend estático servido pelo Nginx (mesmo caminho onde o install.sh implanta o projeto)
    location = /app {
        return 301 /app/;
    }
    location /app/ {
        alias /opt/infralab/01-Paulo-Servidor-Web/frontend/;
        index index.html;
    }

    # Proxy reverso para o backend FastAPI (porta 8000)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
